openapi: 3.0.0

info:
  title: Gas Cylinder Booking System API
  version: 1.0.0
  description: Production-grade API documentation

servers:
  - url: http://localhost:5000

tags:
  - name: Health
  - name: Auth
  - name: Orders
  - name: Payments
  - name: Delivery
  - name: Invoice
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    RegisterRequest:
      type: object
      required: [name, phone, address, city, state]
      properties:
        name: { type: string }
        phone: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        customerType:
          type: string
          enum: [DOMESTIC, COMMERCIAL]
        areaType:
          type: string
          enum: [URBAN, RURAL]
        subsidyEligible:
          type: boolean

    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string

    VerifyOtpRequest:
      type: object
      required: [phone, otp]
      properties:
        phone:
          type: string
        otp:
          type: string

    CreateOrderRequest:
      type: object
      required:
        - cylinderType
        - quantity
        - deliveryAddress
        - paymentMethod
      properties:
        cylinderType:
          type: string
          enum: [KG_14_2, KG_19, KG_47_5]
        quantity:
          type: integer
        deliveryAddress:
          type: string
        paymentMethod:
          type: string
          enum: [UPI, CASH]

    OrderIdRequest:
      type: object
      required: [orderId]
      properties:
        orderId:
          type: string

    PaymentRequest:
      type: object
      required: [orderId, method]
      properties:
        orderId:
          type: string
        method:
          type: string
          enum: [UPI, CASH]

    CreatePartnerRequest:
      type: object
      required: [name, phone, serviceZone]
      properties:
        name:
          type: string
        phone:
          type: string
        serviceZone:
          type: string

security:
  - bearerAuth: []

paths:

  /ping:
    get:
      tags: [Health]
      security: []
      summary: Health Check
      responses:
        "200":
          description: Server running

  /api/auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register Customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: Customer registered

  /api/auth/send-otp:
    post:
      tags: [Auth]
      security: []
      summary: Send Customer OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        "200":
          description: OTP sent

  /api/auth/verify-otp:
    post:
      tags: [Auth]
      security: []
      summary: Verify Customer OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        "200":
          description: Login success

  /api/auth/partner-send-otp:
    post:
      tags: [Auth]
      security: []
      summary: Send Partner OTP

  /api/auth/partner-verify-otp:
    post:
      tags: [Auth]
      security: []
      summary: Verify Partner OTP

  /api/auth/admin-login:
    post:
      tags: [Auth]
      security: []
      summary: Admin Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current Profile

  /api/orders:
    post:
      tags: [Orders]
      summary: Create Order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'

  /api/orders/my-orders:
    get:
      tags: [Orders]
      summary: Get My Orders

  /api/orders/eligibility:
    get:
      tags: [Orders]
      summary: Eligibility Check

  /api/orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get Order By ID
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string

  /api/orders/{orderId}/cancel:
    patch:
      tags: [Orders]
      summary: Cancel Order
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string

  /api/payments/process:
    post:
      tags: [Payments]
      summary: Process Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'

  /api/payments/cash:
    post:
      tags: [Payments]
      summary: Cash Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderIdRequest'

  /api/payments/retry:
    post:
      tags: [Payments]
      summary: Retry Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderIdRequest'

  /api/delivery/my-orders:
    get:
      tags: [Delivery]
      summary: Assigned Orders

  /api/delivery/assign:
    post:
      tags: [Delivery]
      summary: Assign Partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderIdRequest'

  /api/delivery/start:
    post:
      tags: [Delivery]
      summary: Start Delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderIdRequest'

  /api/delivery/complete:
    post:
      tags: [Delivery]
      summary: Complete Delivery With Photos
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId:
                  type: string
                beforePhoto:
                  type: string
                  format: binary
                afterPhoto:
                  type: string
                  format: binary
                signaturePhoto:
                  type: string
                  format: binary

  /api/invoices/generate:
    post:
      tags: [Invoice]
      summary: Generate Invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderIdRequest'

  /api/invoices/{orderId}:
    get:
      tags: [Invoice]
      summary: Get Invoice
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string

  /api/admin/partners:
    get:
      tags: [Admin]
      summary: Get Partners
    post:
      tags: [Admin]
      summary: Create Delivery Partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartnerRequest'

  /api/admin/assignments:
    get:
      tags: [Admin]
      summary: Auto Assignment Logs
 