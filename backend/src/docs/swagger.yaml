openapi: 3.0.0

info:
  title: Gas Cylinder Booking System API
  version: 1.0.0
  description: Production-grade backend API documentation for full system testing

servers:
  - url: http://localhost:5000

tags:
  - name: Health
  - name: Auth
  - name: Orders
  - name: Payments
  - name: Delivery
  - name: Invoice

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:

  /ping:
    get:
      tags:
        - Health
      summary: Health check
      security: []
      responses:
        "200":
          description: Server is running

  # ---------------- AUTH ----------------

  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register Customer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
                - address
                - city
                - state
                - customerType
                - areaType
              example:
                name: Ravi Kumar
                phone: "9000000001"
                address: T Nagar
                city: Chennai
                state: TN
                customerType: DOMESTIC
                areaType: URBAN
                subsidyEligible: true
      responses:
        "201":
          description: Customer registered successfully
        "409":
          description: Customer already exists

  /api/auth/send-otp:
    post:
      tags:
        - Auth
      summary: Send OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              example:
                phone: "9000000001"
      responses:
        "200":
          description: OTP sent successfully
        "404":
          description: Customer not found

  /api/auth/verify-otp:
    post:
      tags:
        - Auth
      summary: Verify OTP (Login)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - otp
              example:
                phone: "9000000001"
                otp: "123456"
      responses:
        "200":
          description: Login successful
        "400":
          description: Invalid or expired OTP

  # ---------------- ORDERS ----------------

  /api/orders:
    post:
      tags:
        - Orders
      summary: Create Order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customerId
                - cylinderType
                - quantity
                - deliveryAddress
                - paymentMethod
              example:
                customerId: "cmp123"
                cylinderType: KG_14_2
                quantity: 1
                deliveryAddress: "T Nagar, Chennai"
                paymentMethod: UPI
      responses:
        "201":
          description: Order created successfully
        "400":
          description: Validation error
        "404":
          description: Customer not found

  /api/orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get Order by ID
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order fetched successfully
        "404":
          description: Order not found

  # ---------------- PAYMENTS ----------------

  /api/payments/process:
    post:
      tags:
        - Payments
      summary: Process Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
                - method
              example:
                orderId: "ord123"
                method: UPI
      responses:
        "200":
          description: Payment processed successfully
        "404":
          description: Order not found
        "409":
          description: Invalid payment state

  # ---------------- DELIVERY ----------------

  /api/delivery/assign:
    post:
      tags:
        - Delivery
      summary: Assign Delivery Partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
              example:
                orderId: "ord123"
      responses:
        "200":
          description: Partner assigned successfully
        "404":
          description: Order not found
        "409":
          description: No partner available or invalid state

  /api/delivery/start:
    post:
      tags:
        - Delivery
      summary: Start Delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
              example:
                orderId: "ord123"
      responses:
        "200":
          description: Delivery started
        "409":
          description: Invalid delivery state

  /api/delivery/complete:
    post:
      tags:
        - Delivery
      summary: Complete Delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
              example:
                orderId: "ord123"
      responses:
        "200":
          description: Delivery completed
        "409":
          description: Invalid delivery state

  # ---------------- INVOICE ----------------

  /api/invoices/generate:
    post:
      tags:
        - Invoice
      summary: Generate Invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
              example:
                orderId: "ord123"
      responses:
        "200":
          description: Invoice generated successfully
        "409":
          description: Invoice already exists

  /api/invoices/{orderId}:
    get:
      tags:
        - Invoice
      summary: Get Invoice by Order ID
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invoice fetched successfully
        "404":
          description: Invoice not found